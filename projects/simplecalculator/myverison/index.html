<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator | My version</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- A simple Calculator for you to use, kidddo -->
    <main>
        <section class="calculator">
            <!-- We would have the display and the keyboard section -->
            <div class="display">
                <!-- Display area, keep anything we want -->
                <input type="text" name="userdisp1" id="expression" readonly>
                <input type="text" name="userdisp2" id="answer" value="0" readonly>
            </div>
            <div class="keyboard">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operator">AC</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operator">x</button>

                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operator">-</button>

                <button>0</button>
                <button class="operator">/</button>
                <button class="operator">+</button>
                <button class="operator">=</button>
            </div>
        </section>
    </main>
    
    <!-- The place to add the JavaScript fiels or script -->
    <script src="script.js"></script>
</body>
</html>
