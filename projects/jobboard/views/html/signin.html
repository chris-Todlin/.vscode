<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp Form</title>
</head>
<body>
    <main class="container">
        <form name="signin" action="/signin" enctype="application/x-www-form-urlencoded" method="post">
            <h1>SignUp Form</h1>

            <div class="inputs">
                <label for="name">Name :</label>
                <input type="text" name="username" id="name" required>
            </div>

            <div class="inputs">
                <label for="password">Password :</label>
                <input type="text" name="userpass" id="password" required>
            </div>

            <div class="btn">
                <button type="submit">Log In</button>
            </div>
        </form>
    </main>
</body>
</html>
