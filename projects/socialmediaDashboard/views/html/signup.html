<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="shortcut icon" href="icon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/form.css">
</head>
<body>
    <div class="container">
        <!-- Form for the sign up -->
        <form name="signup" class="signin" action="/signup" method="post">
            <h1>Sign In</h1>
            <div class="error invisible"></div>
            <div class="inputs">
                <label for="name">Username: </label>
                <input type="text" name="username" id="name" required>
            </div>
            <div class="inputs">
                <label for="pass">Password: </label>
                <input type="password" name="userpass" id="pass" required>
            </div>
            <div class="inputs">
                <label for="repass">Re-enter Password: </label>
                <input type="password" name="userrepass" id="repass" required>
            </div>
            <div class="button">
                <button type="submit">Sign Up</button>
            </div>
        </form>
    </div>

    <script src="js/signup.js"></script>
</body>
</html>
