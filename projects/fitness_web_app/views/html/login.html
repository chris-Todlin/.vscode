<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
</head>
<body>
    <div class="container">
        <form name="login" action="/login" method="post" enctype="application/x-www-form-urlencoded">
            <div class="inputs">
                <label for="name">Username: </label>
                <input type="text" name="username" id="name" placeholder="John Doe" required>
            </div>
            <div class="inputs">
                <label for="pass">Password: </label>
                <input type="password" name="userpass" id="pass" required>
            </div>
            <div class="btn">
                <button type="submit">Log In</button>
            </div>
        </form>
    </div>
</body>
</html>
