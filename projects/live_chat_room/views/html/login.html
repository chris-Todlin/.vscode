<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <main>
        <form name="login" method="post" enctype="application/x-www-form-urlencoded" action="/login">
            <h1>Login Form</h1>
            
            <div class="inputs">
                <label for="name">Name</label>
                <input type="text" name="name" id="name">
            </div>
            <div class="inputs">
                <label for="password">Password</label>
                <input type="password" name="password" id="password">
            </div>
            <div class="btn">
                <button type="submit">Log In</button>
            </div>
        </form>
    </main>
</body>
</html>
