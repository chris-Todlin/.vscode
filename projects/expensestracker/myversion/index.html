<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <article class="main">
            <div class="content">
                <h1>Expense Tracker</h1>

                <!-- section for the transaction, tell you the balance -->
                <section class="transactions">
                    <div class="balance">
                        <h2>Balance</h2>
                        <span class="sbol">Ksh.</span>
                        <p id="balance">50</p>
                    </div>
                    <div class="list">
                        <h2>Transactions</h2>
                        <ul id="listul">
                            <li class="income">
                                <span id="purpose">Salary</span>
                                <span id="val">+Ksh. 100</span>
                            </li>
                            <li class="expense">
                                <span id="purpose">Electricity Bill</span>
                                <span id="val">-Ksh. 50</span>
                            </li>
                        </ul>
                    </div>
                </section>

                <!-- Section for the addition of the input field for the expense and description and amount -->
                <section class="inputs">
                    <div class="layout">
                        <label>Description:<input type="text" name="desc" id="desc" placeholder="Enter a description"></label>
                        <label>Amount:<input type="text" name="amount" id="amount" placeholder="Enter amount"></label>
                    </div>
                    <div class="layout">
                        <button id="income" class="income">Income</button>
                        <button id="expense" class="expense">Expense</button>
                    </div>
                </section>
            </div>
        </article>
    </main>

    <!-- JavaScript files -->
    <script src="script.js"></script>
</body>
</html>
