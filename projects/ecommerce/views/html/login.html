<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mwakai Shopping Site - Login Form</title>
    <link rel="stylesheet" href="css/form.css">
</head>
<body>
    <main>
        <form name="login" action="/login" role="form" autocomplete="on" method="post">
            <h1>Login Form</h1>
            <div class="error invisible"><!-- Error display part -->
            </div>
            <div class="inputs">
                <label for="name">Name: </label>
                <input type="text" name="username" id="name" placeholder="Joe Doe" required>
            </div>

            <div class="inputs">
                <label for="password">Password: </label>
                <input type="password" name="password" id="password" required>
            </div>

            <div class="button">
                <button type="submit">Log In</button>
            </div>
        </form>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
