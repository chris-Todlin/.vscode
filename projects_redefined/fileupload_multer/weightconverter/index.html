<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Weight Converter</h1>
    </header>
    <main>
        <section class="input">
            <!-- Use the on change not enter or keydown -->
            <input type="number" name="weight" id="weight" min="0" placeholder="Enter pounds to convert...">
        </section>
        <section class="output">
        </section>
    </main>
    <div class="message">
    </div>
    <script src="./weight.js"></script>
</body>
</html>
