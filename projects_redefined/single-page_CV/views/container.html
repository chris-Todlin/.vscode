<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 Containers</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
</head>
<body>
    <header class="container p-5 bg-primary my-4 text-white rounded">
        <h1>My First Bootstrap Page - container</h1>
        <p>Tis is a trail page</p>
    </header>
    <main class="container-fluid">
        <h1>My First Bootstrap Page - container-fluid</h1>
        <p>Tis is a trail page</p>
    </main>
    <footer>
        <div class="container-sm bg-green-400">.container-sm</div>
        <div class="container-md bg-gray-600">.container-md</div>
        <div class="container-lg bg-amber-400">.container-lg</div>
        <div class="container-xl bg-blue-700">.container-xl</div>
        <div class="container-xxl bg-orange-800">.container-xxl</div>
    </footer>
</body>
</html>
