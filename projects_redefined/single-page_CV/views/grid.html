<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Basics - Bootstrap</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
</head>
<body>
    <header class=" container-fluid">
        <h1>Grid System in Bootstrap</h1>

        <article class="container-fluid mt-4">
            <section class="row">
                <div class="col bg-gray-500">span 1</div>
                <div class="col bg-gray-500">span 2</div>
                <div class="col bg-gray-500">span 3</div>
                <div class="col bg-gray-500">span 4</div>
                <div class="col bg-gray-500">span 5</div>
                <div class="col bg-gray-500">span 6</div>
                <div class="col bg-gray-500">span 7</div>
                <div class="col bg-gray-500">span 8</div>
                <div class="col bg-gray-500">span 9</div>
                <div class="col bg-gray-500">span 10</div>
                <div class="col bg-gray-500">span 11</div>
                <div class="col bg-gray-500">span 12</div>
            </section>
        </article>
    </header>
    <main class="container-fluid">
        <section class="row bg-gray-700 text-center">
            <div class="col-sm-3">col-sm-3</div>
            <div class="col-sm-3">col-sm-3</div>
            <div class="col-sm-3">col</div>
        </section>
    </main>
</body>
</html>
