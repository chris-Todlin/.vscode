<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <title>BootStrap Buttons</title>
</head>
<body>
    <div class="container py-5">
        <!-- Trial on buttons -->
        <button type="button" class="btn btn-link">Link</button>

        <p class="mt-3"></p>

        <button type="button" class="btn btn-outline-light text-dark">success</button>

        <h2 class="mt-4">Button size</h2>
        <button class="btn btn-outline-primary btn-lg">Large</button>
        <button class="btn btn-outline-primary">Default</button>
        <button class="btn btn-outline-primary btn-sm">small</button>

        <h2 class="mt-4">Block Level Buttons</h2>

        <div class="btn-group">
            <button type="button" class="btn btn-outline-primary">Full-Width Button 1<sup>st</sup></button>
            <button type="button" class="btn btn-outline-primary">Full-Width Button middle</button>
            <button type="button" class="btn btn-outline-primary">Full-Width Button last</button>
        </div>
    </div>

    <section class="dropping container">
        <h2>A drop down Example</h2>
        <div class="btn-group btn-group-lg">
            <button type="button" class="btn btn-primary">7</button>
            <button type="button" class="btn btn-primary">8</button>
            <div class="btn-group">
                <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">7</button>
                <div class="dropdown-menu">
                    <button type="button" class="btn btn-primary dropdown-item">8</button>
                    <button type="button" class="btn btn-primary dropdown-item">9</button>
                </div>
            </div>
        </div>
    </section>

    <section class="calculator container">
        <div class="keyboard">
            <div class="btn-group-vertical">
                <button type="button" class="btn btn-primary">7</button>
                <button type="button" class="btn btn-primary">8</button>
                <button type="button" class="btn btn-primary">9</button>
            </div>
        </div>
    </section>

    <section class="badges container mt-5">
        <!-- Adding a mssage or notification -->
        <button class="btn btn-primary">
            <!-- Notification of the application -->
            Messages <span class="badge rounded-pill bg-danger">4</span>
        </button>
    </section>

    <section class="alerts container mt-5">
        <h1>Alerts in the road</h1>
        <div class="alert alert-success alert-dismissible fade show">
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            <p class="info"></p>
            <div class="btn-group">
                <button type="button" class="btn btn-primary">Edit</button>
                <button type="button" class="btn btn-warning">Delete</button>
            </div>
        </div>
    </section>

    <section class="cards container mt-4">
        <h2>Cards in BootStrap</h2>
        <section class="card mt-2 mb-5" style="width: 400px;">
            <div class="card-body">
                <img src="../../../projects/ecommerce/public/favicon/favicon.ico" alt="" class="card-img-top">
                <div class="card-img-overlay">
                    <h4 class="card-title">Card Title</h4>
                    <p class="card-text">Sme example text.</p>
                    <a href="#" class="card-link">Card Link</a>
                    <a href="#" class="btn btn-primary">Another card Link</a>
                    </div>
            </div>
        </section>
    </section>

    <script src="../node_modules/@popperjs/core/dist/umd/popper.min.js"></script>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
</body>
</html>
