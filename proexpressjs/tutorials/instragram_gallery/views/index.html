<!-- html file for rendering -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storify</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
</head>
<body class="container">
    <div class="row">
        <h1>{{title}} <small>by {{author.name}}</small></h1>
        <p>{{description}}</p>
    </div> 
    <div class="row">
        <ul class="img-thumbnail">
            {{#each elements}}
                <li class="col-span-3">
                    <a href="{{permalink}}" target="_blank" class="img-thumbnail">
                        <img src="{{data.image.src}}" alt="{{data.image.caption}}">
                    </a>
                </li>
            {{/each}}
        </ul>
    </div>  
</body>
</html>
